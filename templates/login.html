{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ورود به پنل مدیریت | خانم زند</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
<link rel="stylesheet" href="{% static 'assets/app.css' %}">
</head>
<body class="font-sans antialiased">
<main class="relative grid min-h-screen place-items-center overflow-hidden bg-royal-l/50 px-4">
  <div class="blob absolute -left-24 -top-24 h-96 w-96 rounded-full bg-royal/10 blur-3xl"></div>
  <div class="blob absolute -bottom-24 -right-24 h-96 w-96 rounded-full bg-royal/10 blur-3xl"></div>

  <form method="post" action="" class="pop relative w-full max-w-sm rounded-3xl border border-royal/10 bg-white p-8 shadow-2xl shadow-royal/15{% if form.errors %} shake{% endif %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">

    <div class="mx-auto mb-5 grid h-14 w-14 place-items-center rounded-2xl bg-royal text-white shadow-lg shadow-royal/30">
      <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
    </div>
    <h1 class="mb-1 text-center text-xl font-extrabold text-royal-d">ورود به پنل مدیریت</h1>
    <p class="mb-6 text-center text-sm text-slate-500">خانم زند</p>

    <label for="id_username" class="mb-1.5 block text-sm font-semibold">نام کاربری</label>
    <input id="id_username" name="username" dir="ltr" autocomplete="username" autofocus required class="mb-4 w-full rounded-2xl border-2 border-slate-200 bg-white px-4 py-3 text-left outline-none transition focus:border-royal focus:ring-4 focus:ring-royal/15">

    <label for="id_password" class="mb-1.5 block text-sm font-semibold">رمز عبور</label>
    <input id="id_password" name="password" type="password" dir="ltr" autocomplete="current-password" required class="w-full rounded-2xl border-2 border-slate-200 bg-white px-4 py-3 text-left outline-none transition focus:border-royal focus:ring-4 focus:ring-royal/15">

    <div class="mt-3 min-h-6 text-sm text-red-600" role="alert">{% if form.errors %}نام کاربری یا رمز عبور اشتباه است{% endif %}</div>

    <button class="mt-2 inline-flex w-full items-center justify-center rounded-full bg-royal px-7 py-3 font-semibold text-white shadow-lg shadow-royal/25 transition duration-300 hover:-translate-y-0.5 hover:bg-royal-d active:scale-95">ورود</button>
    <a href="/" class="mt-5 block text-center text-sm text-royal hover:underline">بازگشت به سایت</a>
  </form>
</main>
</body>
</html>
